[project]
name = "freecad-buddy"
version = "0.1.0"
description = "MCP-Server für PartDesign/Sketcher-basierte 3D-Druck-Projekte in FreeCAD"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "pyright>=1.1.414",
    "poethepoet>=0.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buddy_server"]

[tool.pytest.ini_options]
# Standardlauf = Projekt-Python. Core-Tests laufen separat in FreeCADs Python (poe test-core).
testpaths = ["tests/tools"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "addon/FreeCADBuddy", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["buddy_core", "buddy_bridge", "buddy_server", "freecad_env"]
known-third-party = ["FreeCAD", "FreeCADGui", "Part", "Sketcher", "PartDesign"]

[tool.pyright]
include = ["src", "addon/FreeCADBuddy", "tools", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
extraPaths = ["addon/FreeCADBuddy", "tools"]
executionEnvironments = [
    # FreeCAD-Module sind kompilierte Extensions ohne Stubs.
    { root = "addon/FreeCADBuddy", extraPaths = ["addon/FreeCADBuddy"], reportMissingImports = "none" },
    { root = "tests/core", extraPaths = ["addon/FreeCADBuddy"], reportMissingImports = "none" },
    { root = "tools", extraPaths = ["tools"], reportMissingImports = "none" },
    { root = "src" },
    { root = "tests", extraPaths = ["tools"] },
]

[tool.poe.tasks]
test-tools = "pytest tests/tools"
test-core = "python tools/freecad_env.py run-core-tests"
lint = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }]
typecheck = "pyright"
test = ["test-tools", "test-core"]
check = ["lint", "typecheck", "test"]
