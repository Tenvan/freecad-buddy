[project]
name = "freecad-buddy"
version = "0.2.0"
description = "MCP-Server mit TUI für PartDesign/Sketcher-basierte 3D-Druck-Projekte in FreeCAD"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2,<3",
    "textual>=8.2,<9",
    "uvicorn>=0.54",
]

[project.scripts]
freecad-buddy = "buddy_server.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "pyright>=1.1.414",
    "poethepoet>=0.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# buddy_bridge is shipped too: the server uses its stdlib-only client and protocol modules.
packages = ["src/buddy_server", "addon/FreeCADBuddy/buddy_bridge"]

[tool.pytest.ini_options]
# Standardlauf = Projekt-Python. Tests in FreeCADs Python laufen separat (poe test-core).
testpaths = ["tests/tools", "tests/server"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "addon/FreeCADBuddy", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# German user-facing texts deliberately use typographic characters such as "–".
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pycodestyle]
# The formatter targets 110; long help strings (tool descriptions) may run a bit longer.
max-line-length = 125

[tool.ruff.lint.isort]
known-first-party = ["buddy_core", "buddy_bridge", "buddy_server", "freecad_env"]
known-third-party = ["FreeCAD", "FreeCADGui", "Part", "Sketcher", "PartDesign", "Mesh", "MeshPart"]

[tool.pyright]
include = ["src", "addon/FreeCADBuddy", "tools", "tests", "examples"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
extraPaths = ["addon/FreeCADBuddy", "tools", "src"]
executionEnvironments = [
    # FreeCAD-Module sind kompilierte Extensions ohne Stubs.
    { root = "addon/FreeCADBuddy", extraPaths = ["addon/FreeCADBuddy"], reportMissingImports = "none" },
    { root = "tests/core", extraPaths = ["addon/FreeCADBuddy"], reportMissingImports = "none" },
    { root = "tests/bridge", extraPaths = ["addon/FreeCADBuddy"], reportMissingImports = "none" },
    { root = "tools", extraPaths = ["tools", "addon/FreeCADBuddy"], reportMissingImports = "none" },
    { root = "src", extraPaths = ["addon/FreeCADBuddy"] },
    { root = "tests", extraPaths = ["tools", "addon/FreeCADBuddy", "src", "examples"] },
]

[tool.poe.tasks]
test-tools = "pytest tests/tools tests/server"
test-core = "python tools/freecad_env.py run-core-tests"
install-addon = "python tools/freecad_env.py install-addon"
uninstall-addon = "python tools/freecad_env.py uninstall-addon"
addon-status = "python tools/freecad_env.py addon-status"
headless-bridge = "python tools/freecad_env.py headless-bridge"
lint = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }]
typecheck = "pyright"
test = ["test-tools", "test-core"]
check = ["lint", "typecheck", "test"]
